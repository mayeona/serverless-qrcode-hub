# Via（通过）+ QR，寓意“通过二维码访问”
name = "viaq"
main = "index.js"
compatibility_date = "2025-09-15"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[[d1_databases]]
# Worker 脚本中访问资源的变量名
binding = "DB"
# D1数据库名
database_name = "qrcode_hub"
database_id = "3572f19f-1d24-4811-80ef-38e695349a48"

[triggers]
crons = ["0 2 */1 * *"]

# [[env.dev.d1_databases]]
# binding = "DB"
# database_name = "qrcode_hub_dev"
# database_id = ""

# [env.dev.triggers]
# crons = ["*/10 * * * * *"]

# Worker 可以直接服务静态资源，例如前端页面、JS、图片等
[assets]
# 存放静态文件的目录
directory = "./dist"
# Worker 脚本中访问资源的变量名
binding = "ASSETS"
